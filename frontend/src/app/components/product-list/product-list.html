<div class="table-container">
  <mat-card class="table-card" appearance="outlined">
    <mat-card-header class="table-card-header">
      <mat-card-title>Products</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @let products = (products$ | async);

      @if (!products) {
        <div class="spinner-container">
          <mat-spinner></mat-spinner>
        </div>
      } @else {
      <table mat-table [dataSource]="products" class="mat-elevation-z8">

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let product"> {{product.name}} </td>
      </ng-container>

      <!-- Price Column -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Price </th>
        <td mat-cell *matCellDef="let product"> {{ product.price | currency:'CAD':'symbol':'1.2-2' }} </td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Type </th>
        <td mat-cell *matCellDef="let product">{{ getDisplayType(product.type) }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button color="primary" (click)="buyProduct(product)">
            <mat-icon>shopping_cart</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Header Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- Data Rows -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  }
    </mat-card-content>
  </mat-card>
</div>

<div>
  <app-cart></app-cart>
</div>

<div>
  <app-order-list></app-order-list>
</div>
