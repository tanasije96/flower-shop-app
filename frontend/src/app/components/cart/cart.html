<div class="table-container">
    <mat-card class="table-card" appearance="outlined">
        <mat-card-header class="table-card-header">
            <mat-card-title>Cart</mat-card-title>
        </mat-card-header>
        <mat-card-content> 
            @let items = (items$ | async);

            @if (!items || items.length === 0) {
                <div class="empty-items-list-container">
                <p>Empty Cart.</p>
                </div>
            } @else {
                <div class="table-wrapper">
                    <table mat-table [dataSource]="(items$ | async) ?? []">
                        <ng-container matColumnDef="productId">
                        <th mat-header-cell *matHeaderCellDef>Product</th>
                        <td mat-cell *matCellDef="let item">{{ item.productId }}</td>
                        </ng-container>

                        <ng-container matColumnDef="quantity">
                        <th mat-header-cell *matHeaderCellDef>Qty</th>
                        <td mat-cell *matCellDef="let item">{{ item.quantity }}</td>
                        </ng-container>

                        <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Actions</th>
                        <td mat-cell *matCellDef="let item">
                            <button mat-button (click)="removeItem(item.productId)">
                            Remove
                            </button>
                        </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="['productId','quantity','actions']"></tr>
                        <tr mat-row *matRowDef="let row; columns: ['productId','quantity','actions']"></tr>
                    </table>
                </div>
            }
        </mat-card-content>
        <mat-card-actions>
            <button class="button" mat-raised-button color="primary" (click)="checkout()" [disabled]="isCartEmpty$ | async">
                Checkout
            </button>
        </mat-card-actions>
    </mat-card>
</div>
